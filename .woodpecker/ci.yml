---
# ubitofu baseline, package, release, and per-PR mutation gates. Public images
# only; no credentials in this file, so anyone can fork and run identical CI.
#
# On tag events: test + gitleaks run, then build-dist, then release-forgejo
# creates a Forgejo release with wheel + sdist assets attached. Mirror sync
# (Forgejo→GitHub) and PyPI publish continue to run from the private monorepo.

# GitHub Actions owns the supported package matrix: Linux x86-64 on CPython
# 3.11 through 3.14, macOS arm64 on 3.11 and 3.14, and Linux arm64 on 3.11.
# This Docker-only Woodpecker pool remains the Linux 3.11 fast gate; it cannot
# honestly schedule macOS jobs, so it does not claim to be that release matrix.
steps:
  - name: test
    image: python:3.11-bookworm
    commands:
      - bash ci/install-tofu.sh
      - pip install -c ci/constraints.txt -e ".[dev]"
      - ruff check .
      - mypy src
      - python ci/mutation_gate.py check
      - pytest -q
    when:
      event: [push, pull_request, tag, manual, cron]

  - name: gitleaks
    image: zricethezav/gitleaks:latest
    commands:
      - gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 1
    when:
      event: [push, pull_request, tag, manual, cron]

  # Build wheel + sdist so plugin-release can attach them as release assets.
  - name: build-dist
    image: python:3.11-slim
    commands:
      - pip install -c ci/constraints.txt build
      - python -m build
      - python -m venv /tmp/wheel-install
      - /tmp/wheel-install/bin/python -m pip install dist/*.whl
      - /tmp/wheel-install/bin/python -c 'import tree_sitter, tree_sitter_hcl'
      - python -m venv /tmp/sdist-install
      - /tmp/sdist-install/bin/python -m pip install dist/*.tar.gz
      - /tmp/sdist-install/bin/python -c 'import tree_sitter, tree_sitter_hcl'
    depends_on: [test]
    when:
      event: tag

  # Create a Forgejo release for the tag with wheel + sdist attached. Runs only
  # after the dist build AND gitleaks gate both pass. base_url comes from
  # CI_FORGE_URL (injected by Woodpecker — nothing hardcoded here).
  - name: release-forgejo
    image: woodpeckerci/plugin-release
    settings:
      api_key:
        from_secret: forgejo_ci_token
      files:
        - dist/*.whl
        - dist/*.tar.gz
      title: "${CI_COMMIT_TAG}"
      note: CHANGELOG.md
    depends_on: [build-dist, gitleaks]
    when:
      event: tag

  # Layer 1: per-PR incremental gate.
  # Runs only when a correctness-critical module is touched; scopes mutmut to the
  # changed modules and fails if any mutant survives.  Depends on the test step so
  # it only fires after the baseline suite passes.
  - name: mutation-pr
    image: python:3.11-bookworm
    depends_on: [test]
    commands:
      - bash ci/install-tofu.sh
      - pip install -c ci/constraints.txt -e ".[dev]"
      # Changed modules come from Woodpecker's native CI_PIPELINE_FILES — no
      # git fetch/diff needed.
      - python ci/mutation_gate.py pr
    when:
      event: pull_request
      # ci/mutation_gate.py check enforces exact equality with pyproject and
      # MODULES before a mutation worker is started.
      path:
        include:
          - src/ubitofu/cleaner.py
          - src/ubitofu/cli.py
          - src/ubitofu/config.py
          - src/ubitofu/controller.py
          - src/ubitofu/controller_projection.py
          - src/ubitofu/coverage.py
          - src/ubitofu/enumerator.py
          - src/ubitofu/errors.py
          - src/ubitofu/file_metadata.py
          - src/ubitofu/file_transaction.py
          - src/ubitofu/generate.py
          - src/ubitofu/hcl_index.py
          - src/ubitofu/hcl_patches.py
          - src/ubitofu/hcl_writer.py
          - src/ubitofu/health.py
          - src/ubitofu/import_emitter.py
          - src/ubitofu/inspect.py
          - src/ubitofu/manifest.py
          - src/ubitofu/module_index.py
          - src/ubitofu/outcomes.py
          - src/ubitofu/pipeline.py
          - src/ubitofu/plan_check.py
          - src/ubitofu/reconcile_model.py
          - src/ubitofu/reconcile_planner.py
          - src/ubitofu/reconcile_renderer.py
          - src/ubitofu/reconcile_snapshot.py
          - src/ubitofu/runtime.py
          - src/ubitofu/secrets.py
          - src/ubitofu/tofu_json.py
          - src/ubitofu/tofu_runner.py
          - src/ubitofu/values.py
