---
# Live controller-scenario suite (spec: docs/superpowers/specs/
# 2026-07-19-container-controller-testing-design.md). The controllers run
# as Woodpecker services — plain containers, no docker socket, no DinD.
# Readiness is the harness's URL-mode login poll (rc == "ok"), because
# Woodpecker does not gate steps on service health. UOS is deliberately
# absent: its runtime contract (caps/cgroupns/tmpfs) is not expressible as
# a service under the rootless agent — UOS runs in the (dormant) GHA
# workflow and locally.
#
# Serialized behind the ci workflow, and not run on bare pushes: with two
# workflows per pipeline and push+PR pipeline pairs, four concurrent
# workflows made the Woodpecker server's SQLite lock ("database is
# locked" → lost workflow lease → agent cancels). Until the server moves
# off SQLite, at most one heavy workflow runs at a time.

depends_on:
  - ci

services:
  - name: seeded
    # Image tag and UNIFI_TEST_EXPECT_VERSION below MUST carry the same
    # version literal (contract: CI never runs without the expectation).
    image: ghcr.io/jamesbraid/unifi-network:10.4.57-seeded
  - name: sim
    image: ghcr.io/jamesbraid/unifi-network:10.4.57-sim

steps:
  # `tofu init` inside each sandbox pulls the provider pinned in
  # tests/controllertest/pins.py from registry.terraform.io (the fork is not
  # published to the OpenTofu registry), so this step needs egress there as
  # well as to the image registry.
  - name: controller-tests
    image: python:3.11-bookworm
    environment:
      UNIFI_TEST_SEEDED_URL: https://seeded:8443
      UNIFI_TEST_SIM_URL: https://sim:8443
      UNIFI_TEST_EXPECT_VERSION: "10.4.57"
      UNIFI_TEST_REQUIRE: "1"
    commands:
      - bash ci/install-tofu.sh
      - pip install -e ".[dev,controller]"
      # `herder` is excluded for the same reason UOS is: the rootless agent
      # gives the step no docker socket, and the herder starts device
      # containers itself. Those scenarios run locally and in the (dormant)
      # GHA workflow, which has native Docker.
      - python -m pytest tests/controllertest -m "controller and not uos and not herder" -v
    when:
      event: [pull_request, tag, manual]
