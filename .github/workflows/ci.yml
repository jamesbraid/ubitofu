name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.11"
            package-boundary: true
          - os: ubuntu-24.04
            python: "3.12"
            package-boundary: false
          - os: ubuntu-24.04
            python: "3.13"
            package-boundary: false
          - os: ubuntu-24.04
            python: "3.14"
            package-boundary: true
          - os: macos-14
            python: "3.11"
            package-boundary: false
          - os: macos-14
            python: "3.14"
            package-boundary: false
          - os: ubuntu-24.04-arm
            python: "3.11"
            package-boundary: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python }}"
      - uses: opentofu/setup-opentofu@v1
        with: { tofu_version: "1.12.0", tofu_wrapper: false }
      - run: pip install -c ci/constraints.txt -e ".[dev]"
      - run: ruff check .
      - run: mypy src
      - run: python ci/mutation_gate.py check
      - run: pytest -q
      - if: matrix.package-boundary
        run: |
          pip install -c ci/constraints.txt build
          python -m build
          python -m venv wheel-install
          wheel-install/bin/python -m pip install dist/*.whl
          wheel-install/bin/python -c "import tree_sitter, tree_sitter_hcl"
          wheel-install/bin/ubitofu --help
          python -m venv sdist-install
          sdist-install/bin/python -m pip install dist/*.tar.gz
          sdist-install/bin/python -c "import tree_sitter, tree_sitter_hcl"
          sdist-install/bin/ubitofu --help
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
