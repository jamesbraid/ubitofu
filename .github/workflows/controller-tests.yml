---
# Controller-scenario suite, full matrix including UOS-native.
# DORMANT BY DESIGN: workflow_dispatch only. Enablement TODO (recorded per
# the testing contract and go-unifi precedent):
#   1. When enabling pull_request/push triggers WITH path filters AND making
#      this a required check: add an exact-inverse same-name no-op twin
#      (see go-unifi .github/workflows/integration-noop.yaml) or
#      non-matching PRs hang forever on "Expected".
#   2. Add a nightly `schedule:` run to catch upstream drift and image rot
#      independent of PR traffic.
#   3. Release process: this job becomes a gate in the release workflow
#      when releases wire through GHA (spec: out-of-scope follow-up).
# A missing image tag stays honest-red — never fall back to building.
# Same for the herder: it is installed from its pinned unifi-emu release,
# never built from that repository's source.
#
# triggers (commented, dormant):
#   pull_request:
#   push: { branches: [main] }
#   schedule: [{ cron: "17 4 * * *" }]
name: controller-tests

on:
  workflow_dispatch:

jobs:
  controller-scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install OpenTofu
        # The script apt-gets and unzips into /usr/local/bin — root-only
        # paths. Woodpecker's step containers run as root; GitHub-hosted
        # runners run as the `runner` user with passwordless sudo.
        run: sudo bash ci/install-tofu.sh
      - name: Install unifi-emu-herder
        # unifi-emu's own action: it downloads the release for the runner's
        # os/arch, checksum-verifies it and puts it on PATH. The ref selects
        # the release and must equal pins.py EMU_VERSION — test_pins.py
        # enforces that. Runners have native Docker, so the herder can start a
        # device fleet here, which is why these scenarios run in this workflow
        # and not in Woodpecker, whose rootless agent has no socket.
        id: herder
        uses: jamesbraid/unifi-emu/.github/actions/install-herder@v0.5.1
      - name: Install package with controller extras
        run: pip install -c ci/constraints.txt -e ".[dev,controller]"
      - name: Run controller scenarios (testcontainers, incl. UOS and herder)
        env:
          UNIFI_TEST_REQUIRE: "1"
          UNIFI_TEST_EXPECT_VERSION: "10.4.57"
          # bundled network-app version reported on 7443 — NOT the UOS platform version (see tests/controllertest/test_scenarios_uos.py)
          UNIFI_TEST_UOS_EXPECT_VERSION: "10.4.57"
          UNIFI_TEST_HERDER_BIN: ${{ steps.herder.outputs.path }}
          # No synthetic image here on purpose: a release herder compiles in
          # the one built from its own tag, so the two can never disagree.
        run: python -m pytest tests/controllertest -m controller -v
