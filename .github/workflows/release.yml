name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

# Publish to PyPI via Trusted Publishing (OIDC) — no API token stored anywhere.
jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -c ci/constraints.txt build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
