# Generic secret scanning only (gitleaks default rules).
#
# This repo is destined for a public mirror, so the private-identifier
# denylist deliberately does NOT live here — the patterns are themselves
# the identifiers they exist to block. The denylist workflow reads it from
# a private forge variable at scan time and applies it on its own.
[extend]
useDefault = true

[allowlist]
description = """Deliberately fake values in recorded test transcripts. The
UOS probe transcript (tests/controllertest/uos.py docstring) demonstrates a
rejected bogus API key; tag builds scan full history, where the line predates
its inline gitleaks:allow comment, so the value needs a content allowlist."""
regexes = ['''bogus-key-000''']
