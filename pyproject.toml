[project]
name = "ubitofu"
version = "0.10.1"
description = "Generate OpenTofu HCL from a live UniFi controller and reconcile independent UI and IaC changes without applying plans."
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [{name = "James Braid"}]
requires-python = ">=3.11,<3.15"
keywords = ["unifi", "ubiquiti", "udm", "unifi-controller", "opentofu", "terraform", "terraform-import", "iac", "infrastructure-as-code", "hcl", "network-automation"]
dependencies = [
    "python-hcl2>=8",
    "httpx>=0.27",
    "tree-sitter==0.26.0",
    "tree-sitter-hcl==1.2.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
    "Intended Audience :: System Administrators",
    "Environment :: Console",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "hypothesis>=6", "pytest-cov>=5", "mutmut>=3.6", "build>=1", "setuptools>=68"]
controller = ["testcontainers>=4.15"]

[project.urls]
Homepage = "https://github.com/jamesbraid/ubitofu"
Source = "https://github.com/jamesbraid/ubitofu"
Issues = "https://github.com/jamesbraid/ubitofu/issues"

[project.scripts]
ubitofu = "ubitofu.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ubitofu = ["dns_record_contract_v2.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not controller'"
markers = [
    "controller: needs a live containerized UniFi controller (excluded by default)",
    "uos: UniFi OS Server flavor (subset of controller)",
    "herder: also starts a device fleet via unifi-emu-herder (needs a docker socket)",
]

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["ubitofu"]
strict = true

[tool.coverage.run]
source = ["ubitofu"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.mutmut]
source_paths = ["src/ubitofu/"]
only_mutate = [
    "src/ubitofu/cleaner.py",
    "src/ubitofu/cli.py",
    "src/ubitofu/config.py",
    "src/ubitofu/controller.py",
    "src/ubitofu/controller_projection.py",
    "src/ubitofu/coverage.py",
    "src/ubitofu/enumerator.py",
    "src/ubitofu/errors.py",
    "src/ubitofu/file_metadata.py",
    "src/ubitofu/file_transaction.py",
    "src/ubitofu/generate.py",
    "src/ubitofu/hcl_index.py",
    "src/ubitofu/hcl_patches.py",
    "src/ubitofu/hcl_writer.py",
    "src/ubitofu/health.py",
    "src/ubitofu/import_emitter.py",
    "src/ubitofu/inspect.py",
    "src/ubitofu/manifest.py",
    "src/ubitofu/module_index.py",
    "src/ubitofu/outcomes.py",
    "src/ubitofu/pipeline.py",
    "src/ubitofu/plan_check.py",
    "src/ubitofu/reconcile_model.py",
    "src/ubitofu/reconcile_planner.py",
    "src/ubitofu/reconcile_renderer.py",
    "src/ubitofu/reconcile_snapshot.py",
    "src/ubitofu/runtime.py",
    "src/ubitofu/secrets.py",
    "src/ubitofu/tofu_json.py",
    "src/ubitofu/tofu_runner.py",
    "src/ubitofu/values.py",
]
pytest_add_cli_args = ["--hypothesis-profile=mutation"]
# The distribution test deliberately installs into an environment without dev
# dependencies. Mutmut's instrumented source needs its trampoline runtime, so
# packaging that synthetic tree cannot exercise the real distribution boundary.
pytest_add_cli_args_test_selection = ["--ignore=tests/test_packaging.py"]
mutate_only_covered_lines = true
# Infrastructure tests read CI configs, the mutation gate, and its operator
# documentation off the repository root. Mutmut runs the suite from mutants/,
# which otherwise receives only the source and test trees, so copy those inputs
# into every worker sandbox.
also_copy = [".woodpecker", ".github", "ci", "docs"]
# Keep every test association. Mutmut 3.6/3.7's optional bounded stack walk
# crashes on CPython's synthetic <frozen ...> import frames during collection.
max_stack_depth = -1
